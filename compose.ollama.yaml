# Opzionale: avvia un nuovo Ollama insieme a Jenny.
# Non usarlo se vuoi collegarti all'Ollama che hai già.
services:
  jenny-web:
    environment:
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://ollama:11434
    depends_on:
      - ollama
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
volumes:
  ollama-models:
